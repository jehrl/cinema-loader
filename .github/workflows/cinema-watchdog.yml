name: Cinema City watchdog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinema-city-odyssea-watchdog
  cancel-in-progress: false

jobs:
  check-cinema-city:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check for new IMAX 70mm sessions
        env:
          RUN_ONCE: "1"
          WATCH_STATE_PATH: app/watch-state.json
          NTFY_SERVER: https://ntfy.sh
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if node app/index.js; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Notify if all checker attempts failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl --fail --retry 3 \
            -H "Title: Cinema watchdog failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "All three Cinema City checks failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Persist notified sessions
        run: |
          if git diff --quiet -- app/watch-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/watch-state.json
          git commit -m "chore: remember notified Cinema City sessions"
          git push
